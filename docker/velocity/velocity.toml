# Tournament Velocity proxy. Match servers are registered at runtime by the
# plugin, but the persistent lobby is required at startup so Velocity always
# has at least one server registered.
bind = "0.0.0.0:29020"
motd = "Tournament Platform"
show-max-players = 500
online-mode = true
force-key-authentication = true
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret = "tournament-dev-secret-change-me"
announce-forge = false
ping-passthrough = "DISABLED"
enable-player-address-logging = true

[servers]
# Persistent lobby server (entry point for players)
lobby = "lobby:25565"
# Default/fallback servers tried on login or kick
try = [ "lobby" ]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true

[query]
enabled = false
port = 29020
map = "Velocity"
show-plugins = false
