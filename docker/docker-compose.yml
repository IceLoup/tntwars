# Tournament Platform Docker Compose Stack
# Uses pre-built template images from templates/ (built via docker/build.sh)
# Services: redis, postgres, velocity (proxy), lobby (persistent entry point)
# Match servers are provisioned dynamically as containers from tournament-gameserver image.

name: tournament

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [tournament]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tournament
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [tournament]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament -d tournament"]
      interval: 5s
      timeout: 3s
      retries: 10

  velocity:
    image: tournament-velocity:latest
    restart: unless-stopped
    ports:
      - "2920:2920"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [tournament]

  lobby:
    image: tournament-lobby:latest
    restart: unless-stopped
    # Lobby is accessible internally on the tournament network for Velocity forwarding
    # Expose externally only if you want direct access (optional)
    # ports:
    #   - "25566:25565"
    depends_on:
      redis:
        condition: service_healthy
    networks: [tournament]

networks:
  tournament:
    name: tournament
    driver: bridge

volumes:
  pgdata: